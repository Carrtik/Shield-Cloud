apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shieldcloud-ingress
  namespace: shieldcloud
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # SSL/TLS configuration would go here
spec:
  rules:
  - host: api.shieldcloud.local
    http:
      paths:
      - path: /auth(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      - path: /encrypt(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: encryption-service
            port:
              number: 3002
      - path: /storage(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: storage-service
            port:
              number: 3003
